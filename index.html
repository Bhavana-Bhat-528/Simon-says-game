<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon Says - Arcade Edition</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="arcade-panel" id="main-panel">
      <h1>Simon Says</h1>
      <h2 id="status-heading">Tap anywhere or press any key to start</h2>

      <div class="score-board">
        <span>Score: <strong id="current-score">0</strong></span>
        <span>Best: <strong id="high-score">0</strong></span>
      </div>

      <div class="btn-container">
        <button class="btn red" id="red" aria-label="Red button"></button>
        <button
          class="btn yellow"
          id="yellow"
          aria-label="Yellow button"
        ></button>
        <button class="btn green" id="green" aria-label="Green button"></button>
        <button class="btn blue" id="blue" aria-label="Blue button"></button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
